<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="480" viewBox="0 0 1420 480">
<style>.l{stroke:#263b50;stroke-width:4;fill:none}.a{fill:#e8f3fb;stroke:#245c83;stroke-width:3}.p{fill:#e8f7ef;stroke:#28744b;stroke-width:3}.w{fill:#fff0dc;stroke:#a65a00;stroke-width:3}.t{font:700 16px sans-serif;text-anchor:middle;fill:#172533}.s{font:14px sans-serif;fill:#344b60}</style>
<text x="20" y="230" class="s">Contaminated water</text><path d="M155 225 H245" class="l"/>
<rect x="245" y="150" width="210" height="150" class="a"/><text x="350" y="205" class="t">LEAD GAC BED</text><text x="350" y="234" class="s" text-anchor="middle">6 m / EBCT 600 s</text><text x="350" y="261" class="s" text-anchor="middle">primary adsorption</text>
<path d="M455 225 H700" class="l"/><text x="578" y="208" class="s" text-anchor="middle">lead-bed effluent</text>
<rect x="700" y="150" width="210" height="150" class="a"/><text x="805" y="205" class="t">LAG GAC BED</text><text x="805" y="234" class="s" text-anchor="middle">6 m / EBCT 600 s</text><text x="805" y="261" class="s" text-anchor="middle">breakthrough guard</text>

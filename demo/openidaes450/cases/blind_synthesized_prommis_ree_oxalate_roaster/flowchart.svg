  <rect x="960" y="414" width="240" height="112" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="3"/>
  <text x="1080" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0f172a">REO Product</text>
  <text x="1080" y="493" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">rare-earth oxide</text>

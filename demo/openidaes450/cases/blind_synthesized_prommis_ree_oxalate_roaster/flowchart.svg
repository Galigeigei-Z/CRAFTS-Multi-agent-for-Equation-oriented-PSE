  <text x="92" y="644" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Source basis: PrOMMiS REEOxalateRoaster docs list gas, solid, and liquid inlet streams plus gas/product outlets; no standalone PFD is published.</text>

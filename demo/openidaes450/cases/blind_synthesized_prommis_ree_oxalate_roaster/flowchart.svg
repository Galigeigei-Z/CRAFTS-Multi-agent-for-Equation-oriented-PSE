  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">PrOMMiS REE Oxalate Roaster</text>
  <text x="70" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">Official-doc-informed topology for converting rare-earth oxalate precipitate to oxide product</text>
  <rect x="80" y="160" width="222" height="96" rx="8" fill="#e0f2fe" stroke="#075985" stroke-width="3"/>
  <text x="191" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Gas Feed</text>

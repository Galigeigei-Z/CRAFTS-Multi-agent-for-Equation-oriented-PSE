  <rect x="510" y="256" width="286" height="184" rx="14" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/>
  <text x="653" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0f172a">REEOxalate</text>
  <text x="653" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Roaster</text>
  <text x="653" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">heat transfer + pressure change</text>
  <rect x="960" y="210" width="240" height="112" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="3"/>

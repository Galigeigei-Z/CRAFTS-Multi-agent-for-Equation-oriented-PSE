  <text x="191" y="383" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">REE oxalate solids</text>
  <rect x="80" y="464" width="222" height="96" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="191" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Liquid Feed</text>

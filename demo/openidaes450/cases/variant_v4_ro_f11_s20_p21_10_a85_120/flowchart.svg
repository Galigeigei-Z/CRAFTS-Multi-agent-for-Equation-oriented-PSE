<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="430" viewBox="0 0 1380 430">
<style>.l{stroke:#263b50;stroke-width:4;fill:none}.p{fill:#e8f3fb;stroke:#245c83;stroke-width:3}.r{fill:#e8f7ef;stroke:#28744b;stroke-width:3}.b{fill:#fff0dc;stroke:#a65a00;stroke-width:3}.t{font:700 16px sans-serif;text-anchor:middle;fill:#172533}.s{font:14px sans-serif;fill:#344b60}</style>
<text x="20" y="185" class="s">2 kg/m3 feed</text><path d="M125 180 H185" class="l"/><circle cx="225" cy="180" r="38" class="p"/><text x="225" y="186" class="t">P1</text><path d="M263 180 H330" class="l"/>
<rect x="330" y="130" width="140" height="100" class="r"/><text x="400" y="174" class="t">RO1</text><text x="400" y="200" class="s" text-anchor="middle">loose pass</text>
<path d="M400 230 V320 H520" class="l"/><text x="525" y="325" class="s">first-pass brine</text><path d="M470 180 H560" class="l"/>
<circle cx="600" cy="180" r="38" class="p"/><text x="600" y="186" class="t">P2</text><path d="M638 180 H710" class="l"/>
<rect x="710" y="130" width="140" height="100" class="r"/><text x="780" y="174" class="t">RO2</text><text x="780" y="200" class="s" text-anchor="middle">tight polish</text>
<path d="M850 180 H1035" class="l"/><rect x="1035" y="145" width="130" height="70" class="p"/><text x="1100" y="186" class="t">Product</text><text x="1180" y="172" class="s">~20 ppm NaCl</text>
